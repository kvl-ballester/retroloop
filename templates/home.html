{% extends "base_app.html" %}

{% block title %}Home - Retroloop{% endblock %}

{% block content %}
<div class="mx-auto max-w-5xl px-4 py-10 sm:px-6">
    <h1 class="page-heading">Weekly feedback</h1>
    {% if user.is_authenticated %}
        <p class="mt-4 text-slate-700">You are logged in as {{ user.username }}.</p>
    {% else %}
        <p class="mt-4 text-slate-700">You are not logged in.</p>
        <div class="mt-6 flex gap-3">
            <a href="{% url 'signup' %}" class="btn-primary">Sign up</a>
            <a href="{% url 'login' %}" class="btn-secondary">Log in</a>
        </div>
    {% endif %}
</div>
{% endblock %}
