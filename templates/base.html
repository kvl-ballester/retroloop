{% load static %}
<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">

</body>
</html>
